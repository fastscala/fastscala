com.fastscala.core.debug=true
# Note: can be very slow!:
com.fastscala.core.debug.deleted_contexts_full_path=false
com.fastscala.core.virtual-threads=true
com.fastscala.core.random-ids=false
com.fastscala.core.gc.percent-of-pages-to-delete=10
com.fastscala.core.gc.run-when-less-than-mem-free-percent=5
com.fastscala.core.periodic-page-keep-alive.enabled=true
com.fastscala.core.periodic-page-keep-alive.period-millis=10000
com.fastscala.core.periodic-page-keep-alive.defunct-after-millis=30000

# Can be slow:
com.fastscala.core.events.create_session.enable=false
com.fastscala.core.events.create_page.enable=false
com.fastscala.core.events.create_anon_page.enable=false
com.fastscala.core.events.create_file_download.enable=false
com.fastscala.core.events.create_file_upload.enable=false
com.fastscala.core.events.create_callback.enable=false
com.fastscala.core.events.use_callback.enable=false
com.fastscala.core.events.gc_session.enable=false
com.fastscala.core.events.gc_page.enable=false
com.fastscala.core.events.gc_anon_page.enable=false
com.fastscala.core.events.gc_file_download.enable=false
com.fastscala.core.events.gc_callback.enable=false
com.fastscala.core.events.gc_file_upload.enable=false
com.fastscala.core.events.not_found_session.enable=false
com.fastscala.core.events.not_found_page.enable=false
com.fastscala.core.events.not_found_anon_page.enable=false
com.fastscala.core.events.not_found_file_download.enable=false
com.fastscala.core.events.not_found_file_upload.enable=false
com.fastscala.core.events.not_found_callback.enable=false

com.fastscala.server.helper.port=8080
com.fastscala.server.helper.is-local=true
com.fastscala.server.helper.setup-prometheus-jvm-metrics=false
com.fastscala.server.helper.prometheus-http-server.enabled=false
com.fastscala.server.helper.prometheus-http-server.port=8081